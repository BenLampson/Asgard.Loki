name: Bug report
description: Report a reproducible library or provider problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include API keys, authorization headers, session contents or private media. Follow SECURITY.md for vulnerabilities.
  - type: input
    id: packages
    attributes:
      label: Package names and versions
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: .NET SDK, runtime and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized configuration and the provider protocol involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or upstream responses
