name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Asgard.Loki.slnx
      - name: Build
        run: dotnet build Asgard.Loki.slnx -c Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true
      - name: Test
        run: ./eng/Test.ps1
      - name: Pack
        run: dotnet pack Asgard.Loki.slnx -c Release --no-build -p:ContinuousIntegrationBuild=true -o artifacts/packages
      - name: Verify package boundaries and metadata
        run: |
          ./eng/Verify-PackageBoundaries.ps1
          [xml]$properties = Get-Content src/Directory.Build.props -Raw
          ./eng/Publish-Packages.ps1 -Version ([string]$properties.Project.PropertyGroup.Version)
      - name: Upload NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
